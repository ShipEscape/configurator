<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终端配置</title>
<style>
:root {
  --paper: #e9eef0; --sheet: #f6f8f8; --ink: #14232f; --mute: #64767f; --line: #c3cfd4; --gray: #d3d9dc;
  --sea: #1f6f78; --warn: #b7791f; --bad: #d9480f; --ok: #2f9e44; --nh: 34px; --c: 14px;
  --cut: polygon(0 0, calc(100% - var(--c)) 0, 100% var(--c), 100% 100%, var(--c) 100%, 0 calc(100% - var(--c)));
  --cut2: polygon(0 0, calc(100% - var(--c) + .4px) 0, 100% calc(var(--c) - .4px), 100% 100%, calc(var(--c) - .4px) 100%, 0 calc(100% - var(--c) + .4px));
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
[hidden] { display: none !important; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .mute { color: var(--mute); }

/* 切角方框 */
section { position: relative; background: var(--line); clip-path: var(--cut); padding: 18px 20px; margin: 0; }
section::before { content: ""; position: absolute; inset: 1px; background: var(--sheet); clip-path: var(--cut2); }
section > * { position: relative; }
h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h2 small { font-size: 13px; font-weight: 500; color: var(--mute); }

/* 右上角连接状态圆圈、错误提示 */
.conn { position: fixed; top: 12px; right: 16px; z-index: 60; width: var(--nh); height: var(--nh); border-radius: 50%; display: grid; place-items: center; background: rgba(246, 248, 248, .85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 6px 24px -10px rgba(20, 35, 47, .3); }
.toast { position: fixed; top: calc(12px + var(--nh) + 10px); right: 16px; z-index: 60; max-width: 300px; padding: 8px 16px; color: #fff; background: var(--ink); clip-path: var(--cut); --c: 10px; animation: in .25s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(-6px); } }

.app { max-width: 1040px; margin: 0 auto; padding: 60px 20px 40px; }
.page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (max-width: 820px) { .page { grid-template-columns: 1fr; } }
.verdict { font-size: 22px; font-weight: 700; }
.note { margin: 8px 0 0; font-size: 13px; color: var(--mute); word-break: break-all; }
.link { background: none; border: 0; padding: 0; color: var(--sea); font-weight: 600; }

/* Wi-Fi 列表 */
.aphead { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.ap:last-child .aphead { border-bottom: 0; }
.ssid { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 12px; font-weight: 600; color: var(--ok); }
.apform { display: flex; gap: 8px; padding: 10px 2px 14px; border-bottom: 1px solid var(--line); }
.ap:last-child .apform { border-bottom: 0; }

/* 表单 */
label { display: block; margin-bottom: 16px; font-weight: 600; }
label small { display: block; margin-top: 4px; font-weight: 400; color: var(--mute); }
input { width: 100%; margin-top: 6px; padding: 8px 10px; border: 1px solid var(--line); background: var(--paper); font-weight: 400; }
.apform input { margin: 0; flex: 1; }
.ap.sel .aphead { font-weight: 600; background: var(--paper); }
.btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.go, .ghost { position: relative; z-index: 0; --c: 10px; padding: 7px 28px; border: 0; clip-path: var(--cut); white-space: nowrap; background: var(--ink); color: #fff; }
.ghost { color: var(--ink); }
.ghost::before { content: ""; position: absolute; inset: 1px; z-index: -1; background: var(--sheet); clip-path: var(--cut2); }
.go:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<span class="conn" id="conn"></span>
<div class="toast" id="toast" hidden></div>

<div class="app"><div class="page">
  <div class="col">
    <section>
      <h2>当前连接 <button class="link" id="refresh">刷新</button></h2>
      <div class="verdict" id="cur">读取中</div>
      <p class="note" id="hosts"></p>
      <p class="note warn" id="note" hidden></p>
    </section>
    <section>
      <h2>附近的 Wi-Fi <small id="count"></small></h2>
      <div id="list"></div>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>终端设置</h2>
      <label>设备 ID
        <input id="did" autocomplete="off" spellcheck="false">
        <small>留空则使用树莓派序列号</small>
      </label>
      <label>服务器地址
        <input id="addr" autocomplete="off" spellcheck="false" placeholder="例如 192.168.1.10:8080">
        <small>格式 主机:端口</small>
      </label>
      <div class="btns">
        <button class="go" id="save">保存</button>
        <button class="ghost" id="test" hidden>测试服务器</button>
        <span id="cfgmsg" class="note"></span>
      </div>
    </section>
  </div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let last = null, picked = null, connecting = null, toastTimer;

const toast = m => {
  const t = $('#toast'); t.textContent = m; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4500);
};
const api = async (url, opt) => {
  try {
    const r = await fetch(url, opt), j = await r.json().catch(() => ({}));
    if (!r.ok) { toast(j.error || `服务器返回 ${r.status}`); return null; }
    return j;
  } catch { toast('无法连接设备。如果刚切换了 Wi-Fi，请连到同一网络后重新访问'); return null; }
};
const post = (url, body) => api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

const wifiIcon = ok => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${ok ? '#2f9e44' : '#e03131'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>${ok ? '' : '<line x1="3" y1="3" x2="21" y2="21"/>'}</svg>`;
const setConn = ok => { $('#conn').innerHTML = wifiIcon(ok); $('#conn').title = ok ? '已连接 Wi-Fi' : '未连接 Wi-Fi'; };
const bars = s => { const n = s >= 75 ? 4 : s >= 50 ? 3 : s >= 25 ? 2 : 1; return `<svg width="20" height="16" viewBox="0 0 20 16">${[0, 1, 2, 3].map(i => `<rect x="${i * 5}" y="${12 - i * 4}" width="3" height="${4 + i * 4}" rx="1" fill="${i < n ? '#14232f' : '#c3cfd4'}"/>`).join('')}</svg>`; };
const lock = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64767f" stroke-width="2.2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

/* Wi-Fi */
function buildList(points) {
  const box = $('#list'); box.textContent = '';
  $('#count').textContent = points.length ? `${points.length} 个` : '';
  if (!points.length) { box.append(el('p', 'mute', '没有扫描到 Wi-Fi')); return; }
  for (const p of points) {
    const sel = picked && picked.ssid === p.ssid, row = el('div', 'ap' + (sel ? ' sel' : '')), head = el('button', 'aphead');
    head.insertAdjacentHTML('afterbegin', bars(p.strength));
    head.append(el('span', 'ssid', p.ssid));                        // SSID 一律用 textContent，避免被注入
    if (last.state === 'CONNECTED' && last.connection === p.ssid) head.append(el('span', 'tag', '已连接'));
    if (p.secure) head.insertAdjacentHTML('beforeend', lock);
    head.onclick = () => { picked = sel ? null : p; buildList(last.points); };
    row.append(head);
    if (sel && p.secure) {
      const f = el('div', 'apform'), pw = el('input');
      pw.id = 'pw'; pw.type = 'password'; pw.placeholder = `${p.ssid} 的密码`; pw.autocomplete = 'off';
      f.append(pw); row.append(f); setTimeout(() => pw.focus());
    }
    box.append(row);
  }
}
function render(d) {
  last = d;
  const ok = d.state === 'CONNECTED', cur = $('#cur');
  cur.textContent = ok ? `已连接 ${d.connection}` : d.state === 'CONNECTING' ? `正在连接 ${d.connection || ''}` : '热点模式，尚未连接 Wi-Fi';
  cur.className = 'verdict ' + (ok ? 'ok' : d.state === 'CONNECTING' ? 'warn' : 'bad');
  const port = location.port && location.port !== '80' ? ':' + location.port : '';
  $('#hosts').textContent = d.hostnames.length ? '访问地址：' + d.hostnames.map(h => `http://${h}${port}`).join('　') : '';
  setConn(ok);
  $('#test').hidden = !ok;                                           // 只有已连接 Wi-Fi 才能测试服务器
  if (!picked) buildList(d.points);                                  // 选中网络、输入密码时不重建列表
  if (connecting) {
    if (d.state === 'CONNECTING') connecting.seen = true;
    if (ok && d.connection === connecting.ssid) { connecting = null; $('#note').hidden = true; }
    else if ((connecting.seen && d.state === 'HOTSPOT') || Date.now() - connecting.t > 45000) {
      toast('连接失败，请检查密码或信号'); connecting = null; $('#note').hidden = true;
    }
  }
}
async function poll() {
  const d = await api('/api/wifi');
  if (d) render(d); else setConn(false);
}
$('#refresh').onclick = () => { picked = null; poll(); };
(async function loop() { if (document.visibilityState === 'visible') await poll(); setTimeout(loop, connecting ? 2000 : 6000); })();

/* 终端设置 */
const msg = (t, cls = '') => { const m = $('#cfgmsg'); m.textContent = t; m.className = 'note ' + cls; };
async function loadCfg() {
  const c = await api('/api/config'); if (!c) return;
  $('#did').value = c.device_id; $('#did').placeholder = c.serial ? `留空使用序列号 ${c.serial}` : '设备 ID';
  $('#addr').value = c.server_ip_port;
}
$('#test').onclick = async () => {
  const a = $('#addr').value.trim(); if (!a) return msg('请先填写服务器地址', 'warn');
  msg('测试中');
  const r = await api('/api/config/test?addr=' + encodeURIComponent(a));
  if (r) r.ok ? msg('服务器可以连通', 'ok') : msg('无法连通：' + r.error, 'bad');
};
$('#save').onclick = async () => {
  const addr = $('#addr').value.trim(), pw = $('#pw') ? $('#pw').value : '';
  if (!addr) return msg('服务器地址不能为空', 'bad');
  if (picked && picked.secure && !pw) return msg('请输入所选 Wi-Fi 的密码', 'bad');
  const r = await post('/api/config', { device_id: $('#did').value, server_ip_port: addr, ssid: picked ? picked.ssid : '', password: pw });
  if (!r) return;
  msg(r.wifi ? `已保存，正在连接 ${picked.ssid}` : '已保存', 'ok');
  if (r.wifi) {
    connecting = { ssid: picked.ssid, t: Date.now(), seen: false };
    $('#note').textContent = `正在连接 ${picked.ssid}。热点会随之关闭，请把手机连回同一个 Wi-Fi，再用上方地址访问。`;
    $('#note').hidden = false;
  }
  picked = null; poll();
};

loadCfg();
</script>
</body>
</html>
